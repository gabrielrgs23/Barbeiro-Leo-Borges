<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leonardo Borges | Barbeiro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="bg-blur"></div>

<div class="container">

    <!-- LOGO -->
    <div class="profile">
        <img src="logo.jpeg" alt="Leonardo Borges Barbeiro">
    </div>

    <!-- NOME -->
    <h1>Leonardo Borges</h1>

    <!-- DESCRIÇÃO -->
    <p class="subtitle">
        Especialista em Cortes Masculinos
    </p>

    <!-- SERVIÇOS -->
    <p class="trust">
        Corte • Barba • Sobrancelha 
    </p>

    <!-- LINKS -->
    <div class="links">

        <!-- WHATSAPP -->
        <a 
        href="https://wa.me/5511992094472?text=Olá,%20Leonardo!%20Tudo%20bem?%20Encontrei%20seu%20perfil%20e%20gostaria%20de%20agendar%20um%20horário%20para%20corte.%20Você%20pode%20me%20informar%20os%20horários%20disponíveis?"
        target="_blank"
        class="card whatsapp">

            <span class="icon">
                <img src="whatsapp.png">
            </span>

            <div>
                <small>ATENDIMENTO</small>
                <p>Agendar Horário</p>
            </div>

        </a>

        <!-- INSTAGRAM -->
        <a 
        href="https://instagram.com/leo.borges"
        target="_blank"
        class="card instagram">

            <span class="icon">
                <img src="instagram.png">
            </span>

            <div>
                <small>PORTFÓLIO</small>
                <p>Ver Cortes</p>
            </div>

        </a>

        <!-- LOCALIZAÇÃO -->
        <a 
        href="https://www.google.com/maps/search/?api=1&query=Av+Analice+Sakataukas,+209"
        target="_blank"
        class="card maps">

            <span class="icon">
                <img src="maps.png">
            </span>

            <div>
                <small>LOCALIZAÇÃO</small>
                <p>Como Chegar</p>
            </div>

        </a>

    </div>

</div>

<script>

document.addEventListener("mousemove", e => {

document.body.style.setProperty("--x", e.clientX + "px");
document.body.style.setProperty("--y", e.clientY + "px");

});

</script>

</body>

</html>
